// ── Procedural Planet Textures ──
const TEX = 256;

function tH(a) {
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  return ((a ^ (a >>> 16)) & 0xffff) / 0xffff;
}

function n2(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fx*fx*(3-2*fx), v = fy*fy*(3-2*fy);
  const h = (a,b) => tH(a*374761 + b*668265 + s);
  return (h(ix,iy)*(1-u)+h(ix+1,iy)*u)*(1-v) + (h(ix,iy+1)*(1-u)+h(ix+1,iy+1)*u)*v;
}

function fbm(x, y, s, oct) {
  let v=0, a=0.5, f=1;
  for (let i=0; i<oct; i++) { v += a*n2(x*f, y*f, s+i*137); a*=0.5; f*=2; }
  return v;
}

function hsl2rgb(h, s, l) {
  const a = s * Math.min(l, 1-l);
  const f = n => { const k=(n+h*12)%12; return l - a*Math.max(-1, Math.min(k-3, 9-k, 1)); };
  return [f(0)*255|0, f(8)*255|0, f(4)*255|0];
}

function genPat(type, seed) {
  const v = new Float32Array(TEX*TEX);
  for (let y=0; y<TEX; y++) for (let x=0; x<TEX; x++) {
    const nx=x/TEX*6, ny=y/TEX*6;
    let val;
    switch(type) {
      case 0: // Gas giant bands
        val = fbm(nx*0.5, ny*2.5, seed, 5)*0.6
            + Math.sin(ny*4 + fbm(nx, ny, seed+50, 3))*0.15 + 0.3;
        break;
      case 1: { // Rocky cratered
        val = fbm(nx, ny, seed, 6)*0.7 + 0.15;
        for (let c=0; c<8; c++) {
          const cx2=tH(c*9871+seed)*TEX, cy2=tH(c*6271+seed+1)*TEX;
          const cr=tH(c*3571+seed+2)*TEX*0.1+4;
          const cd=Math.hypot(x-cx2, y-cy2);
          if (cd<cr) val = val*0.6 + 0.15*(cd/cr);
        }
        break;
      }
      case 2: { // Swirly vortex
        const ang=Math.atan2(y-TEX/2, x-TEX/2);
        const r2=Math.hypot(x-TEX/2, y-TEX/2)/TEX;
        val = fbm(nx+Math.cos(ang+r2*5)*0.5, ny+Math.sin(ang+r2*5)*0.5, seed, 5)*0.6 + 0.2;
        break;
      }
      case 3: // Crystal faceted
        val = fbm(nx, ny, seed, 3);
        val = Math.abs(Math.sin(val*12))*0.4 + fbm(nx*2, ny*2, seed+50, 2)*0.3 + 0.15;
        break;
    }
    v[y*TEX+x] = Math.max(0, Math.min(1, val));
  }
  return v;
}

function renderTex(base, hue) {
  const c = document.createElement('canvas');
  c.width = c.height = TEX;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(TEX, TEX);
  const d = img.data, half = TEX/2;
  for (let y=0; y<TEX; y++) for (let x=0; x<TEX; x++) {
    const i=y*TEX+x, pi=i*4;
    const dx=x-half, dy=y-half, dist=Math.hypot(dx,dy)/half;
    if (dist > 1) { d[pi+3]=0; continue; }
    let v = base[i];
    // Sphere normals & diffuse light (upper-left source)
    const snx=dx/half, sny=dy/half, snz=Math.sqrt(Math.max(0, 1-snx*snx-sny*sny));
    v *= Math.max(0.12, (-snx*0.35 - sny*0.45 + snz*0.6)*0.55 + 0.45);
    // Atmospheric rim
    v *= 1 - dist*dist*dist*dist*0.6;
    // Specular highlight
    const sd = Math.hypot(snx+0.35, sny+0.35);
    const spec = Math.pow(Math.max(0, 1-sd*2.5), 4)*0.4;
    const sat = 0.5 - spec*0.2;
    const lit = Math.min(1, v*0.7 + spec);
    const [r, g, b] = hsl2rgb(hue/360, sat, lit);
    d[pi]=r; d[pi+1]=g; d[pi+2]=b;
    d[pi+3] = dist > 0.93 ? Math.max(0, (1-dist)/0.07*255)|0 : 255;
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL();
}

// Pre-generate 4 base patterns, tint per node

function layout() {

  const colStep = usableW / 4, rowStep = usableH / 4;
  nodes.forEach(n => {
    n.x = mx + colStep * n.col;
    n.y = my + rowStep * n.row;
    n.baseX = n.x;
    n.baseY = n.y;
    n.r = Math.min(W, H) * 0.058;
  });
}

// Galaxy parameters
const ARMS = 4;
const ARM_SPREAD = 0.45;
const SPIRAL_WIND = 11;     // radians of spiral wrap (~1.75 turns)
const GALAXY_TILT = 0.25;   // elliptical squash for perspective

// Max (initial) and min counts for adaptive quality
const MAX_SPIRAL  = 46000, MIN_SPIRAL  = 2400;
const MAX_BULGE   = 8000,  MIN_BULGE   = 400;
const MAX_FIELD   = 3000,  MIN_FIELD   = 150;
const MAX_NEBULA  = 800,   MIN_NEBULA  = 40;
const MAX_FLOAT   = 12000,  MIN_FLOAT   = 600;
const TARGET_FPS  = 12;

// Current quality scale (1.0 = max, 0.0 = min)
let qualityScale = 1.0;
function scaledCount(max, min) { return Math.round(min + (max - min) * qualityScale); }

// FPS tracking
let fpsFrames = 0, fpsLastTime = performance.now(), fpsCurrent = 60;
let galaxyDirty = true;
let edgeRefs = [];
let nodeRefs = [];

const STAR_VERTEX_SHADER = `
  precision mediump float;
  attribute float aAngle;
  attribute float aDistance;
  attribute float aRotSpeed;
  attribute float aSize;
  attribute float aBrightness;
  attribute float aTwinklePhase;
  attribute float aTwinkleSpeed;
  attribute vec2 aFixedPos;
  attribute vec3 aColor;
  uniform float uTime;
  uniform float uTilt;
  uniform float uPixelRatio;
  varying vec3 vColor;
  varying float vAlpha;

  void main() {
    float twinkle = sin(aTwinklePhase + uTime * aTwinkleSpeed * 60.0);
    float visibleTwinkle = max(0.0, twinkle);
    vec2 pos;

    if (aRotSpeed > 0.0) {
      float angle = aAngle - uTime * 0.03 * aRotSpeed;
      pos = vec2(cos(angle) * aDistance, -sin(angle) * aDistance * uTilt);
    } else {
      pos = aFixedPos;
    }

    vColor = aColor;
    vAlpha = aBrightness * (0.4 + visibleTwinkle * 0.6);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 0.0, 1.0);
    gl_PointSize = max(1.0, aSize * (0.7 + visibleTwinkle * 0.3) * uPixelRatio);
  }
`;

const SOFT_POINT_FRAGMENT_SHADER = `
  precision mediump float;
  varying vec3 vColor;
  varying float vAlpha;

  void main() {
    vec2 p = gl_PointCoord * 2.0 - 1.0;
    float radius = length(p);
    if (radius > 1.0) discard;

    float falloff = 1.0 - smoothstep(0.0, 1.0, radius);
    gl_FragColor = vec4(vColor, vAlpha * falloff);
  }
`;

const NEBULA_VERTEX_SHADER = `
  precision mediump float;
  attribute float aAngle;
  attribute float aDistance;
  attribute float aRotSpeed;
  attribute float aSize;
  attribute float aAlpha;
  attribute vec3 aColor;
  uniform float uTime;
  uniform float uTilt;
  uniform float uPixelRatio;
  varying vec3 vColor;
  varying float vAlpha;

  void main() {
    float angle = aAngle - uTime * 0.03 * aRotSpeed;
    vec2 pos = vec2(cos(angle) * aDistance, -sin(angle) * aDistance * uTilt);
    vColor = aColor;
    vAlpha = aAlpha;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 0.0, 1.0);
    gl_PointSize = aSize * uPixelRatio;
  }
`;

const NEBULA_FRAGMENT_SHADER = `
  precision mediump float;
  varying vec3 vColor;
  varying float vAlpha;

  void main() {
    vec2 p = gl_PointCoord * 2.0 - 1.0;
    float radius = length(p);
    if (radius > 1.0) discard;

    float glow = pow(1.0 - smoothstep(0.0, 1.0, radius), 2.5);
    gl_FragColor = vec4(vColor, vAlpha * glow);
  }
`;

const PARTICLE_VERTEX_SHADER = `
  precision mediump float;
  attribute vec2 aVelocity;
  attribute float aSize;
  attribute float aPhase;
  attribute float aSpeed;
  attribute vec3 aColor;
  uniform float uTime;
  uniform vec2 uViewport;
  uniform float uPixelRatio;
  varying vec3 vColor;
  varying float vAlpha;

  float wrapAxis(float value, float minValue, float maxValue) {
    float span = maxValue - minValue;
    return mod(value - minValue, span) + minValue;
  }

  void main() {
    vec2 pos = position.xy + aVelocity * uTime * 60.0;
    pos.x = wrapAxis(pos.x, -uViewport.x * 0.5 - 10.0, uViewport.x * 0.5 + 10.0);
    pos.y = wrapAxis(pos.y, -uViewport.y * 0.5 - 10.0, uViewport.y * 0.5 + 10.0);

    vColor = aColor;
    vAlpha = max(0.0, 0.15 + 0.25 * sin(aPhase + uTime * aSpeed * 60.0 * 6.28318530718));
    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 0.0, 1.0);
    gl_PointSize = aSize * uPixelRatio;
  }
`;

function makeGalaxyBackground(canvas) {
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: false,
    alpha: false,
    powerPreference: 'high-performance',
  });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x06060f, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
  camera.position.z = 1;

  const stars = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uTilt: { value: GALAXY_TILT },
      uPixelRatio: { value: 1 },
    },
    vertexShader: STAR_VERTEX_SHADER,
    fragmentShader: SOFT_POINT_FRAGMENT_SHADER,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  const nebula = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uTilt: { value: GALAXY_TILT },
      uPixelRatio: { value: 1 },
    },
    vertexShader: NEBULA_VERTEX_SHADER,
    fragmentShader: NEBULA_FRAGMENT_SHADER,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  const particles = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uViewport: { value: new THREE.Vector2(1, 1) },
      uPixelRatio: { value: 1 },
    },
    vertexShader: PARTICLE_VERTEX_SHADER,
    fragmentShader: SOFT_POINT_FRAGMENT_SHADER,
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending,
  });

  return {
    renderer,
    scene,
    camera,
    materials: { stars, nebula, particles },
    layers: { stars: null, nebula: null, particles: null },
  };
}

const galaxyBg = makeGalaxyBackground(bgCanvas);

function centeredX(x, width) {
  return x - width * 0.5;
}

function centeredY(y, height) {
  return height * 0.5 - y;
}

function makeEmptyGeometry(count) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  return geometry;
}

function buildGalaxyGeometries() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const maxR = Math.max(W, H) * 0.52;

  const spiralCount = scaledCount(MAX_SPIRAL, MIN_SPIRAL);
  const bulgeCount = scaledCount(MAX_BULGE, MIN_BULGE);
  const fieldCount = scaledCount(MAX_FIELD, MIN_FIELD);
  const starCount = spiralCount + bulgeCount + fieldCount;

  const starGeometry = makeEmptyGeometry(starCount);
  const starAngle = new Float32Array(starCount);
  const starDistance = new Float32Array(starCount);
  const starRotSpeed = new Float32Array(starCount);
  const starSize = new Float32Array(starCount);
  const starBrightness = new Float32Array(starCount);
  const starTwinklePhase = new Float32Array(starCount);
  const starTwinkleSpeed = new Float32Array(starCount);
  const starFixedPos = new Float32Array(starCount * 2);
  const starColor = new Float32Array(starCount * 3);

  const setStar = (idx, angle, distance, rotSpeed, size, brightness, phase, speed, color, fx = 0, fy = 0) => {
    starAngle[idx] = angle;
    starDistance[idx] = distance;
    starRotSpeed[idx] = rotSpeed;
    starSize[idx] = size;
    starBrightness[idx] = brightness;
    starTwinklePhase[idx] = phase;
    starTwinkleSpeed[idx] = speed;
    starFixedPos[idx * 2] = fx;
    starFixedPos[idx * 2 + 1] = fy;
    starColor[idx * 3] = color[0] / 255;
    starColor[idx * 3 + 1] = color[1] / 255;
    starColor[idx * 3 + 2] = color[2] / 255;
  };

  let starIndex = 0;

  for (let i = 0; i < spiralCount; i++) {
    const arm = i % ARMS;
    const armAngle = (arm / ARMS) * Math.PI * 2;
    const t = Math.pow(Math.random(), 0.6);
    const distance = t * maxR;
    const angle = armAngle + t * SPIRAL_WIND + (Math.random() - 0.5) * ARM_SPREAD * (1 + t);
    const brightness = (1 - t * 0.7) * (0.4 + Math.random() * 0.6);
    const hue = (220 + (arm / ARMS) * 120) % 360 + (Math.random() - 0.5) * 40;
    const radius = (1 - t * 0.5) * (Math.random() * 1.2 + 0.3);
    setStar(
      starIndex++,
      angle,
      distance,
      1 / (1 + t * 3),
      radius * 2,
      brightness,
      Math.random() * Math.PI * 2,
      Math.random() * 0.015 + 0.003,
      hsl2rgb(hue / 360, 0.3, 0.5 + brightness * 0.2),
    );
  }

  for (let i = 0; i < bulgeCount; i++) {
    const distance = Math.pow(Math.random(), 1.5) * maxR * 0.18;
    const brightness = 0.6 + Math.random() * 0.4;
    const hue = 40 + Math.random() * 30;
    const radius = Math.random() * 1.8 + 0.5;
    setStar(
      starIndex++,
      Math.random() * Math.PI * 2,
      distance,
      1.5,
      radius * 2,
      brightness,
      Math.random() * Math.PI * 2,
      Math.random() * 0.01 + 0.003,
      hsl2rgb(hue / 360, 0.3, 0.5 + brightness * 0.2),
    );
  }

  for (let i = 0; i < fieldCount; i++) {
    const brightness = 0.15 + Math.random() * 0.25;
    const hue = Math.random() * 360;
    const radius = Math.random() * 0.8 + 0.2;
    setStar(
      starIndex++,
      0,
      0,
      0,
      radius * 2,
      brightness,
      Math.random() * Math.PI * 2,
      Math.random() * 0.02 + 0.005,
      hsl2rgb(hue / 360, 0.3, 0.5 + brightness * 0.2),
      centeredX(Math.random() * W, W),
      centeredY(Math.random() * H, H),
    );
  }

  starGeometry.setAttribute('aAngle', new THREE.BufferAttribute(starAngle, 1));
  starGeometry.setAttribute('aDistance', new THREE.BufferAttribute(starDistance, 1));
  starGeometry.setAttribute('aRotSpeed', new THREE.BufferAttribute(starRotSpeed, 1));
  starGeometry.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));
  starGeometry.setAttribute('aBrightness', new THREE.BufferAttribute(starBrightness, 1));
  starGeometry.setAttribute('aTwinklePhase', new THREE.BufferAttribute(starTwinklePhase, 1));
  starGeometry.setAttribute('aTwinkleSpeed', new THREE.BufferAttribute(starTwinkleSpeed, 1));
  starGeometry.setAttribute('aFixedPos', new THREE.BufferAttribute(starFixedPos, 2));
  starGeometry.setAttribute('aColor', new THREE.BufferAttribute(starColor, 3));

  const nebulaCount = scaledCount(MAX_NEBULA, MIN_NEBULA) + 1;
  const nebulaGeometry = makeEmptyGeometry(nebulaCount);
  const nebulaAngle = new Float32Array(nebulaCount);
  const nebulaDistance = new Float32Array(nebulaCount);
  const nebulaRotSpeed = new Float32Array(nebulaCount);
  const nebulaSize = new Float32Array(nebulaCount);
  const nebulaAlpha = new Float32Array(nebulaCount);
  const nebulaColor = new Float32Array(nebulaCount * 3);

  const setNebula = (idx, angle, distance, rotSpeed, size, alpha, color) => {
    nebulaAngle[idx] = angle;
    nebulaDistance[idx] = distance;
    nebulaRotSpeed[idx] = rotSpeed;
    nebulaSize[idx] = size;
    nebulaAlpha[idx] = alpha;
    nebulaColor[idx * 3] = color[0] / 255;
    nebulaColor[idx * 3 + 1] = color[1] / 255;
    nebulaColor[idx * 3 + 2] = color[2] / 255;
  };

  let nebulaIndex = 0;
  for (let i = 0; i < nebulaCount - 1; i++) {
    const arm = i % ARMS;
    const armAngle = (arm / ARMS) * Math.PI * 2;
    const t = 0.15 + Math.random() * 0.7;
    const distance = t * maxR;
    const angle = armAngle + t * SPIRAL_WIND + (Math.random() - 0.5) * 0.3;
    const hue = (220 + (arm / ARMS) * 120) % 360 + (Math.random() - 0.5) * 30;
    const radius = maxR * (0.04 + Math.random() * 0.08);
    const alpha = 0.02 + Math.random() * 0.03;
    setNebula(
      nebulaIndex++,
      angle,
      distance,
      1 / (1 + t * 3),
      Math.min(radius * 2, 240),
      alpha,
      hsl2rgb(hue / 360, 0.45, 0.38),
    );
  }

  setNebula(
    nebulaIndex,
    0,
    0,
    0,
    Math.min(maxR * 0.4, 260),
    0.08,
    hsl2rgb(40 / 360, 0.4, 0.3),
  );

  nebulaGeometry.setAttribute('aAngle', new THREE.BufferAttribute(nebulaAngle, 1));
  nebulaGeometry.setAttribute('aDistance', new THREE.BufferAttribute(nebulaDistance, 1));
  nebulaGeometry.setAttribute('aRotSpeed', new THREE.BufferAttribute(nebulaRotSpeed, 1));
  nebulaGeometry.setAttribute('aSize', new THREE.BufferAttribute(nebulaSize, 1));
  nebulaGeometry.setAttribute('aAlpha', new THREE.BufferAttribute(nebulaAlpha, 1));
  nebulaGeometry.setAttribute('aColor', new THREE.BufferAttribute(nebulaColor, 3));

  const particleCount = scaledCount(MAX_FLOAT, MIN_FLOAT);
  const particleGeometry = new THREE.BufferGeometry();
  const particlePositions = new Float32Array(particleCount * 3);
  const particleVelocity = new Float32Array(particleCount * 2);
  const particleSize = new Float32Array(particleCount);
  const particlePhase = new Float32Array(particleCount);
  const particleSpeed = new Float32Array(particleCount);
  const particleColor = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount; i++) {
    const x = centeredX(Math.random() * W, W);
    const y = centeredY(Math.random() * H, H);
    const hue = Math.random() * 360;
    const color = hsl2rgb(hue / 360, 0.8, 0.7);

    particlePositions[i * 3] = x;
    particlePositions[i * 3 + 1] = y;
    particleVelocity[i * 2] = (Math.random() - 0.5) * 0.3;
    particleVelocity[i * 2 + 1] = (Math.random() - 0.5) * 0.3;
    particleSize[i] = (Math.random() * 2.5 + 1) * 2;
    particlePhase[i] = Math.random() * Math.PI * 2;
    particleSpeed[i] = Math.random() * 0.003 + 0.001;
    particleColor[i * 3] = color[0] / 255;
    particleColor[i * 3 + 1] = color[1] / 255;
    particleColor[i * 3 + 2] = color[2] / 255;
  }

  particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  particleGeometry.setAttribute('aVelocity', new THREE.BufferAttribute(particleVelocity, 2));
  particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(particleSize, 1));
  particleGeometry.setAttribute('aPhase', new THREE.BufferAttribute(particlePhase, 1));
  particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(particleSpeed, 1));
  particleGeometry.setAttribute('aColor', new THREE.BufferAttribute(particleColor, 3));

  return { starGeometry, nebulaGeometry, particleGeometry };
}

function replaceGalaxyLayer(name, geometry, material, renderOrder) {
  if (galaxyBg.layers[name]) {
    galaxyBg.scene.remove(galaxyBg.layers[name]);
    galaxyBg.layers[name].geometry.dispose();
  }

  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  points.renderOrder = renderOrder;
  galaxyBg.layers[name] = points;
  galaxyBg.scene.add(points);
}

function rebuildGalaxyScene() {
  const { starGeometry, nebulaGeometry, particleGeometry } = buildGalaxyGeometries();
  replaceGalaxyLayer('nebula', nebulaGeometry, galaxyBg.materials.nebula, 0);
  replaceGalaxyLayer('stars', starGeometry, galaxyBg.materials.stars, 1);
  replaceGalaxyLayer('particles', particleGeometry, galaxyBg.materials.particles, 2);
  galaxyDirty = false;
}

function resizeBg() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

  galaxyBg.renderer.setPixelRatio(pixelRatio);
  galaxyBg.renderer.setSize(W, H, false);
  galaxyBg.camera.left = -W * 0.5;
  galaxyBg.camera.right = W * 0.5;
  galaxyBg.camera.top = H * 0.5;
  galaxyBg.camera.bottom = -H * 0.5;
  galaxyBg.camera.updateProjectionMatrix();

  galaxyBg.materials.stars.uniforms.uPixelRatio.value = pixelRatio;
  galaxyBg.materials.nebula.uniforms.uPixelRatio.value = pixelRatio;
  galaxyBg.materials.particles.uniforms.uPixelRatio.value = pixelRatio;
  galaxyBg.materials.particles.uniforms.uViewport.value.set(W, H);

  galaxyDirty = true;
}
resizeBg();

function drawBg(t) {
  if (galaxyDirty || !galaxyBg.layers.stars) rebuildGalaxyScene();

  galaxyBg.materials.stars.uniforms.uTime.value = t;
  galaxyBg.materials.nebula.uniforms.uTime.value = t;
  galaxyBg.materials.particles.uniforms.uTime.value = t;
  galaxyBg.renderer.render(galaxyBg.scene, galaxyBg.camera);
}

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  return e;
}

function edgePathFor(from, to, W, H) {
  const isReturn = from.row > to.row;
  if (isReturn) {
    const side = to.col < 2 ? -1 : 1;
    const outX = side < 0 ? -W * 0.06 : W * 1.06;
    const x1 = from.x + side * from.r * 0.7;
    const y1 = from.y - from.r * 0.7;
    const x2 = to.x + side * to.r * 0.5;
    const y2 = to.y + to.r * 0.9;
    const cp1x = outX, cp1y = from.y - H * 0.15;
    const cp2x = outX, cp2y = to.y + H * 0.15;
    return `M ${x1} ${y1} C ${cp1x} ${cp1y} ${cp2x} ${cp2y} ${x2} ${y2}`;
  }

  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const nx = dx / dist;
  const ny = dy / dist;
  const x1 = from.x + nx * from.r;
  const y1 = from.y + ny * from.r;
  const x2 = to.x - nx * to.r * 1.15;
  const y2 = to.y - ny * to.r * 1.15;
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2;
  const perpX = -ny * 20;
  const perpY = nx * 20;
  const cx1 = midX + perpX * 0.3;
  const cy1 = midY + perpY * 0.3;
  return `M ${x1} ${y1} Q ${cx1} ${cy1} ${x2} ${y2}`;
}

function buildSVG() {
  svg.innerHTML = '';
  edgeRefs = [];
  nodeRefs = [];
  const W = window.innerWidth, H = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // ── Defs ──
  const defs = el('defs');

  // Glow filter
  const glow = el('filter', { id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%' });
  const blur = el('feGaussianBlur', { stdDeviation: '6', result: 'blur' });
  const merge = el('feMerge');
  merge.appendChild(el('feMergeNode', { in: 'blur' }));
  merge.appendChild(el('feMergeNode', { in: 'SourceGraphic' }));
  glow.appendChild(blur);
  glow.appendChild(merge);
  defs.appendChild(glow);

  // Edge glow
  const edgeGlow = el('filter', { id: 'edgeGlow', x: '-50%', y: '-50%', width: '200%', height: '200%' });
  edgeGlow.appendChild(el('feGaussianBlur', { stdDeviation: '3', result: 'blur' }));
  const em = el('feMerge');
  em.appendChild(el('feMergeNode', { in: 'blur' }));
  em.appendChild(el('feMergeNode', { in: 'SourceGraphic' }));
  edgeGlow.appendChild(em);
  defs.appendChild(edgeGlow);

  // Arrow marker
  const marker = el('marker', {
    id: 'arrowhead', markerWidth: '10', markerHeight: '7',
    refX: '9', refY: '3.5', orient: 'auto', markerUnits: 'strokeWidth'
  });
  marker.appendChild(el('polygon', {
    points: '0 0, 10 3.5, 0 7',
    fill: 'rgba(255,255,255,0.4)',
  }));
  defs.appendChild(marker);

  // Node gradients
  nodes.forEach(n => {
    const grad = el('radialGradient', { id: `grad-${n.id}`, cx: '35%', cy: '35%', r: '65%' });
    const c1 = `hsla(${n.hue}, 70%, 65%, 0.95)`;
    const c2 = `hsla(${n.hue}, 60%, 35%, 0.9)`;
    const c3 = `hsla(${n.hue}, 50%, 15%, 0.85)`;
    grad.appendChild(el('stop', { offset: '0%', 'stop-color': c1 }));
    grad.appendChild(el('stop', { offset: '60%', 'stop-color': c2 }));
    grad.appendChild(el('stop', { offset: '100%', 'stop-color': c3 }));
    defs.appendChild(grad);

    // Sparkle gradient for ring
    const ring = el('radialGradient', { id: `ring-${n.id}`, cx: '50%', cy: '50%', r: '50%' });
    ring.appendChild(el('stop', { offset: '85%', 'stop-color': 'transparent' }));
    ring.appendChild(el('stop', { offset: '95%', 'stop-color': `hsla(${n.hue}, 80%, 70%, 0.6)` }));
    ring.appendChild(el('stop', { offset: '100%', 'stop-color': 'transparent' }));
    defs.appendChild(ring);
  });

  svg.appendChild(defs);

  // ── Edges ──
  const edgeGroup = el('g', { class: 'edges' });
  edges.forEach(([fromId, toId]) => {
    const from = nodeMap[fromId], to = nodeMap[toId];
    const isReturn = from.row > to.row;
    const pathD = edgePathFor(from, to, W, H);

    const path = el('path', {
      d: pathD,
      fill: 'none',
      stroke: `hsla(${(nodeMap[fromId].hue + nodeMap[toId].hue) / 2}, 50%, 55%, ${isReturn ? 0.2 : 0.3})`,
      'stroke-width': isReturn ? '1.5' : '2',
      'stroke-dasharray': isReturn ? '6 4' : 'none',
      'marker-end': 'url(#arrowhead)',
      filter: 'url(#edgeGlow)',
    });
    path.dataset.from = fromId;
    path.dataset.to = toId;
    edgeGroup.appendChild(path);

    // Animated dot along edge
    const dot = el('circle', {
      r: isReturn ? '2' : '2.5',
      fill: `hsla(${nodeMap[fromId].hue}, 80%, 75%, ${isReturn ? 0.5 : 0.8})`,
    });
    const anim = el('animateMotion', {
      dur: `${isReturn ? 4 + Math.random() * 2 : 2 + Math.random() * 2}s`,
      repeatCount: 'indefinite',
      path: pathD,
    });
    dot.appendChild(anim);
    edgeGroup.appendChild(dot);

    edgeRefs.push({
      fromId,
      toId,
      isReturn,
      path,
      anim,
      defaultWidth: isReturn ? '1.5' : '2',
    });
  });
  svg.appendChild(edgeGroup);

  // ── Nodes ──
  const nodeGroup = el('g', { class: 'nodes' });
  nodes.forEach(n => {
    const g = el('g', { class: 'node', 'data-id': n.id });

    // Outer glow circle
    const outerGlow = el('circle', {
      cx: n.x, cy: n.y, r: n.r * 1.3,
      fill: 'none',
      stroke: `hsla(${n.hue}, 70%, 60%, 0.15)`,
      'stroke-width': '1',
    });
    outerGlow.innerHTML = `
      <animate attributeName="r" values="${n.r*1.2};${n.r*1.4};${n.r*1.2}"
        dur="${3 + Math.random()*2}s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.15;0.35;0.15"
        dur="${3 + Math.random()*2}s" repeatCount="indefinite"/>
    `;
    g.appendChild(outerGlow);

    // Planet texture
    const texImg = el('image', {
      href: n.texUrl,
      x: n.x - n.r, y: n.y - n.r,
      width: n.r * 2, height: n.r * 2,
      style: 'pointer-events: none;',
    });
    g.appendChild(texImg);

    // Glow overlay circle
    const circle = el('circle', {
      cx: n.x, cy: n.y, r: n.r,
      fill: `hsla(${n.hue}, 50%, 50%, 0.06)`,
      stroke: `hsla(${n.hue}, 60%, 60%, 0.5)`,
      'stroke-width': '1.5',
      filter: 'url(#glow)',
      style: 'cursor: pointer;',
    });
    g.appendChild(circle);

    // Inner sparkle dots
    const sparkles = [];
    for (let i = 0; i < 5; i++) {
      const angle = (Math.PI * 2 / 5) * i + Math.random() * 0.5;
      const dist = n.r * (0.3 + Math.random() * 0.5);
      const sx = n.x + Math.cos(angle) * dist;
      const sy = n.y + Math.sin(angle) * dist;
      const sparkle = el('circle', {
        cx: sx, cy: sy, r: '1.5',
        fill: `hsla(${n.hue + 30}, 90%, 85%, 0.7)`,
      });
      sparkle.innerHTML = `
        <animate attributeName="opacity" values="0;1;0"
          dur="${1 + Math.random()*2}s" begin="${Math.random()*3}s" repeatCount="indefinite"/>
        <animate attributeName="r" values="0.5;2;0.5"
          dur="${1 + Math.random()*2}s" begin="${Math.random()*3}s" repeatCount="indefinite"/>
      `;
      g.appendChild(sparkle);
      sparkles.push({ el: sparkle, dx: sx - n.x, dy: sy - n.y });
    }

    // Primary name (language-dependent)
    const primaryY = isJa ? -n.r * 0.1 : 0;
    const primaryText = el('text', {
      x: n.x, y: n.y + primaryY,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: '#fff',
      'font-size': `${n.r * 0.3}px`,
      'font-weight': '600',
      'letter-spacing': '0.5px',
      style: 'pointer-events: none;',
    });
    primaryText.textContent = isJa ? n.ja : n.en;
    g.appendChild(primaryText);

    // Secondary name (English mode: show English only; Japanese mode: show English below)
    let secondaryText = null;
    if (isJa) {
      secondaryText = el('text', {
        x: n.x, y: n.y + n.r * 0.25,
        'text-anchor': 'middle', 'dominant-baseline': 'middle',
        fill: `hsla(${n.hue}, 40%, 85%, 0.8)`,
        'font-size': `${n.r * 0.28}px`,
        style: 'pointer-events: none;',
      });
      secondaryText.textContent = n.en;
      g.appendChild(secondaryText);
    }

    nodeGroup.appendChild(g);
    nodeRefs.push({
      node: n,
      group: g,
      outerGlow,
      image: texImg,
      circle,
      sparkles,
      primaryText,
      primaryY,
      secondaryText,
      secondaryY: n.r * 0.25,
    });
  });
  svg.appendChild(nodeGroup);
}

function updateEdgeVisuals() {
  const W = window.innerWidth, H = window.innerHeight;
  edgeRefs.forEach(edge => {
    const pathD = edgePathFor(nodeMap[edge.fromId], nodeMap[edge.toId], W, H);
    edge.path.setAttribute('d', pathD);
    edge.anim.setAttribute('path', pathD);
  });
}

function updateNodeVisuals() {
  nodeRefs.forEach(ref => {
    const { node, outerGlow, image, circle, sparkles, primaryText, primaryY, secondaryText, secondaryY } = ref;
    outerGlow.setAttribute('cx', node.x);
    outerGlow.setAttribute('cy', node.y);
    image.setAttribute('x', node.x - node.r);
    image.setAttribute('y', node.y - node.r);
    circle.setAttribute('cx', node.x);
    circle.setAttribute('cy', node.y);
    sparkles.forEach(sparkle => {
      sparkle.el.setAttribute('cx', node.x + sparkle.dx);
      sparkle.el.setAttribute('cy', node.y + sparkle.dy);
    });
    primaryText.setAttribute('x', node.x);
    primaryText.setAttribute('y', node.y + primaryY);
    if (secondaryText) {
      secondaryText.setAttribute('x', node.x);
      secondaryText.setAttribute('y', node.y + secondaryY);
    }
  });
}

function setHoveredNode(found) {
  if (found === hoveredNode) return;

  hoveredNode = found;
  if (!found) {
    tooltip.classList.remove('show');
    edgeRefs.forEach(edge => {
      edge.path.removeAttribute('stroke-opacity');
      edge.path.setAttribute('stroke-width', edge.defaultWidth);
    });
    nodeRefs.forEach(ref => {
      ref.group.style.opacity = '1';
    });
    return;
  }

  tooltipEn.textContent = isJa ? found.ja : found.en;
  tooltipJa.textContent = isJa ? found.en : '';
  tooltipJa.style.display = isJa ? '' : 'none';
  tooltipDesc.textContent = isJa ? found.descJa : found.descEn;
  tooltip.classList.add('show');

  edgeRefs.forEach(edge => {
    if (edge.fromId === found.id || edge.toId === found.id) {
      edge.path.setAttribute('stroke-opacity', '0.9');
      edge.path.setAttribute('stroke-width', edge.isReturn ? '2.5' : '3');
    } else {
      edge.path.setAttribute('stroke-opacity', '0.15');
      edge.path.setAttribute('stroke-width', '1.5');
    }
  });

  nodeRefs.forEach(ref => {
    const id = ref.node.id;
    ref.group.style.opacity = id === found.id || adjacency[found.id].has(id) ? '1' : '0.25';
  });
}

// ── Hover effects ──
let hoveredNode = null;

svg.addEventListener('mousemove', (e) => {
  const mx = e.clientX, my = e.clientY;
  let found = null;
  nodes.forEach(n => {
    const dx = mx - n.x, dy = my - n.y;
    if (dx * dx + dy * dy < n.r * n.r) found = n;
  });

  setHoveredNode(found);

  if (hoveredNode) {
    const tx = mx + 20, ty = my - 10;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  }
});
svg.addEventListener('mouseleave', () => setHoveredNode(null));

// ── Sparkle cursor trail ──
document.addEventListener('mousemove', (e) => {
  if (Math.random() > 0.3) return;
  const spark = document.createElement('div');
  spark.className = 'sparkle';
  const hue = Math.random() * 360;
  spark.style.left = (e.clientX - 3 + (Math.random() - 0.5) * 20) + 'px';
  spark.style.top = (e.clientY - 3 + (Math.random() - 0.5) * 20) + 'px';
  spark.style.background = `hsla(${hue}, 90%, 75%, 0.9)`;
  spark.style.boxShadow = `0 0 6px hsla(${hue}, 90%, 75%, 0.6)`;
  document.body.appendChild(spark);
  setTimeout(() => spark.remove(), 800);
});

// ── Gentle floating animation ──
let time = 0;
function animate(t) {
  time = t * 0.001;

  // FPS measurement (every 30 frames)
  fpsFrames++;
  if (fpsFrames >= 30) {
    const now = performance.now();
    fpsCurrent = 1000 * fpsFrames / (now - fpsLastTime);
    fpsLastTime = now;
    fpsFrames = 0;

    // Adaptive quality: scale down if below target
    if (fpsCurrent < TARGET_FPS && qualityScale > 0) {
      qualityScale = Math.max(0, qualityScale - 0.15);
      galaxyDirty = true;
      // Trim particles to new count
      const target = scaledCount(MAX_FLOAT, MIN_FLOAT);
      if (particles.length > target) particles.length = target;
      // console.log(`[AdaptiveQ] FPS=${fpsCurrent.toFixed(1)} → scale=${qualityScale.toFixed(2)} (stars=${scaledCount(MAX_SPIRAL,MIN_SPIRAL)+scaledCount(MAX_BULGE,MIN_BULGE)+scaledCount(MAX_FIELD,MIN_FIELD)}, particles=${target})`);
    }
  }

  drawBg(time);

  // Gentle node float
  nodes.forEach((n, i) => {
    const phase = i * 1.3;
    n.x = n.baseX + Math.sin(time * 0.5 + phase) * 3;
    n.y = n.baseY + Math.cos(time * 0.7 + phase) * 2;
  });

  updateNodeVisuals();
  updateEdgeVisuals();

  requestAnimationFrame(animate);
}

// ── Resize ──
window.addEventListener('resize', () => {
  resizeBg();
  layout();
  setHoveredNode(null);
  buildSVG();
});

// ── Init ──
buildSVG();
requestAnimationFrame(animate);
</script>
